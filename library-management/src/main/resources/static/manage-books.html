
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Books - Digital Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            📚 Digital Library - Admin
        </a>

        <a href="admin.html" class="btn btn-outline-light">
            Admin Dashboard
        </a>

    </div>

</nav>


<div class="container mt-5">

    <h2 class="text-center mb-4">
        Manage Books
    </h2>


    <!-- Add Book -->

    <div class="card shadow-sm mb-5">

        <div class="card-body">

            <h4 class="mb-3">
                ➕ Add Book
            </h4>

            <form id="bookForm">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <input type="text"
                               id="title"
                               class="form-control"
                               placeholder="Book Title"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <input type="text"
                               id="author"
                               class="form-control"
                               placeholder="Author"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <input type="text"
                               id="isbn"
                               class="form-control"
                               placeholder="ISBN"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <input type="text"
                               id="category"
                               class="form-control"
                               placeholder="Category"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <input type="number"
                               id="quantity"
                               class="form-control"
                               placeholder="Quantity"
                               required>

                    </div>

                </div>


                <button type="submit"
                        class="btn btn-primary">
                    Add Book
                </button>

            </form>

        </div>

    </div>


    <!-- Books List -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h4 class="mb-3">
                📚 All Books
            </h4>

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Available</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="bookList"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>


// Load Books

function loadBooks() {

    fetch("/books")

        .then(response => response.json())

        .then(books => {

            let bookList = document.getElementById("bookList");

            bookList.innerHTML = "";

            books.forEach(book => {

                bookList.innerHTML += `

                    <tr>

                        <td>${book.id}</td>

                        <td>${book.title}</td>

                        <td>${book.author}</td>

                        <td>${book.category}</td>

                        <td>${book.quantity}</td>

                        <td>${book.availableQuantity}</td>

                        <td>

                            <button class="btn btn-warning btn-sm me-1"
                                    onclick="editBook(${book.id})">
                                Edit
                            </button>

                            <button class="btn btn-danger btn-sm"
                                    onclick="deleteBook(${book.id})">
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            });

        })

        .catch(error => {

            console.log("Error:", error);

        });

}


loadBooks();



// Add Book

document.getElementById("bookForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let quantity = Number(
            document.getElementById("quantity").value
        );


        let book = {

            title: document.getElementById("title").value,

            author: document.getElementById("author").value,

            isbn: document.getElementById("isbn").value,

            category: document.getElementById("category").value,

            quantity: quantity,

            availableQuantity: quantity

        };


        fetch("/books", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(book)

        })

        .then(response => response.json())

        .then(data => {

            alert("Book added successfully!");

            document.getElementById("bookForm").reset();

            loadBooks();

        })

        .catch(error => {

            alert("Failed to add book!");

            console.log(error);

        });

    });



// Delete Book

function deleteBook(id) {

    if (!confirm("Are you sure you want to delete this book?")) {
        return;
    }


    fetch("/books/" + id, {

        method: "DELETE"

    })

    .then(response => response.text())

    .then(data => {

        alert("Book deleted successfully!");

        loadBooks();

    })

    .catch(error => {

        alert("Delete failed!");

        console.log(error);

    });

}



// Edit Book

function editBook(id) {

    let title = prompt("Enter new book title:");

    if (title == null) {
        return;
    }


    let author = prompt("Enter new author:");

    if (author == null) {
        return;
    }


    let isbn = prompt("Enter ISBN:");

    if (isbn == null) {
        return;
    }


    let category = prompt("Enter category:");

    if (category == null) {
        return;
    }


    let quantity = prompt("Enter quantity:");

    if (quantity == null) {
        return;
    }


    let book = {

        title: title,

        author: author,

        isbn: isbn,

        category: category,

        quantity: Number(quantity),

        availableQuantity: Number(quantity)

    };


    fetch("/books/" + id, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(book)

    })

    .then(response => response.json())

    .then(data => {

        alert("Book updated successfully!");

        loadBooks();

    })

    .catch(error => {

        alert("Update failed!");

        console.log(error);

    });

}

</script>


</body>
</html>
