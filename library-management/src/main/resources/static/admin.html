
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Digital Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            📚 Digital Library - Admin
        </a>

        <a href="index.html" class="btn btn-outline-light">
            Home
        </a>

    </div>

</nav>


<div class="container mt-5">

    <h2 class="text-center mb-4">
        Admin Dashboard
    </h2>


    <!-- Books -->

    <div class="card shadow-sm mb-5">

        <div class="card-body">

            <h4 class="mb-3">
                📚 Books
            </h4>

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Available</th>
                        </tr>

                    </thead>

                    <tbody id="bookList"></tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Users -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h4 class="mb-3">
                👥 Users
            </h4>

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>

                    </thead>

                    <tbody id="userList"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

// Load Books

fetch("/books")

    .then(response => response.json())

    .then(books => {

        let bookList = document.getElementById("bookList");

        books.forEach(book => {

            bookList.innerHTML += `

                <tr>

                    <td>${book.id}</td>

                    <td>${book.title}</td>

                    <td>${book.author}</td>

                    <td>${book.category}</td>

                    <td>${book.quantity}</td>

                    <td>${book.availableQuantity}</td>

                </tr>

            `;

        });

    })

    .catch(error => {

        console.log("Books error:", error);

    });


// Load Users

fetch("/users")

    .then(response => response.json())

    .then(users => {

        let userList = document.getElementById("userList");

        users.forEach(user => {

            userList.innerHTML += `

                <tr>

                    <td>${user.id}</td>

                    <td>${user.name}</td>

                    <td>${user.email}</td>

                    <td>${user.role}</td>

                </tr>

            `;

        });

    })

    .catch(error => {

        console.log("Users error:", error);

    });

</script>


</body>
</html>
