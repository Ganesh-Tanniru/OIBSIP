
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Digital Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            📚 Digital Library
        </a>

    </div>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>


                    <form id="registerForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter your name"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">
                            Register
                        </button>

                    </form>


                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let user = {

        name: document.querySelector('input[placeholder="Enter your name"]').value,

        email: document.querySelector('input[placeholder="Enter your email"]').value,

        password: document.querySelector('input[placeholder="Enter your password"]').value,

        role: "USER"

    };


    fetch("/users", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(user)

    })

    .then(response => response.json())

    .then(data => {

        alert("Registration successful!");

        window.location.href = "login.html";

    })

    .catch(error => {

        alert("Registration failed!");

        console.log(error);

    });

});

</script>


</body>
</html>
